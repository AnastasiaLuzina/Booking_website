<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/registration.css') }}">
</head>
<body>
    <div class="auth-container">
        <!-- Исправлено user_bp на user -->
        <form class="auth-form" method="POST" action="{{ url_for('user.registration') }}">
            <h1 class="auth-title">Регистрация</h1>
            
            {% if errors %}
                <div class="error-container">
                    {% for error in errors %}
                        <div class="error-message">{{ error }}</div>
                    {% endfor %}
                </div>
            {% endif %}

            <div class="input-group">
                <label>Имя</label>
                <input type="text" name="first_name" placeholder="Введите ваше имя" required>
            </div>
            
            <div class="input-group">
                <label>Фамилия</label>
                <input type="text" name="second_name" placeholder="Введите вашу фамилию" required>
            </div>
            
            <div class="input-group">
                <label>Отчество</label>
                <input type="text" name="patronymic" placeholder="Введите ваше отчество">
            </div>
            
            <div class="input-group">
                <label>Логин</label>
                <input type="text" name="login" placeholder="Придумайте логин" required>
            </div>
            
            <div class="input-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="example@gmail.com" required>
            </div>
            
            <div class="input-group">
                <label>Возраст</label>
                <input type="number" name="age" placeholder="Ваш возраст" min="1" required>
            </div>
            
            <div class="input-group">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="Создайте пароль" required>
            </div>
            
            <button type="submit" class="auth-button">Зарегистрироваться</button>
            
            <div class="auth-footer">
                <!-- Исправлено здесь тоже -->
                Уже есть аккаунт? <a href="{{ url_for('user.login') }}">Войти</a>
            </div>
        </form>
    </div>
</body>
</html>
