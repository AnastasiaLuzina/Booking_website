{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Редактирование оборудования</h2>
    
    {% if errors %}
    <div class="alert alert-danger">
        <ul>
            {% for error in errors %}
            <li>{{ error }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}
    
    <form method="POST" action="{{ url_for('equipment.edit', equipment_id=equipment[0]) }}">
        <input type="hidden" name="hall_id" value="{{ equipment[1] }}">
        
        <div class="mb-3">
            <label class="form-label">Название оборудования:</label>
            <input type="text" name="name" class="form-control" value="{{ equipment[2] }}" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Количество:</label>
            <input type="number" name="count" class="form-control" value="{{ equipment[3] }}" required min="1">
        </div>
        
        <div class="mb-3">
            <label class="form-label">Описание:</label>
            <textarea name="description" class="form-control">{{ equipment[4] }}</textarea>
        </div>
        
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{{ url_for('equipment.view_equipment', hall_id=equipment[1]) }}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
