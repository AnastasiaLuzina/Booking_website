<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles_auto.css') }}">
    <style>

        .error-message {
            color: #d9534f;
            background-color: #f2dede;
            border: 1px solid #ebccd1;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        
        .error-message p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <!-- Шапка -->
    <header>
        <div class="logo">LET'S DANCE</div>
        <nav>
            <ul>
                <li><a href="#">Главная</a></li>
                <li><a href="#">Каталог</a></li>
                <li><a href="#">О сервисе</a></li>
            </ul>
        </nav>
    </header>

    <!-- Основное содержимое -->
    <main>
        <div class="login-container">
            <h2>Авторизация</h2>
            
            {% if errors %}
                <div class="error-message">
                    {% for error in errors %}
                        <p>{{ error }}</p>
                    {% endfor %}
                </div>
            {% endif %}
            
            <form method="POST" action="{{ url_for('user.authorization') }}">
                <label for="login">Учетная запись</label>
                <input type="text" id="login" name="login" placeholder="qwerty435"
                       value="{{ request.form.login if request.form.login else '' }}">
                
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="password123">
                
                <button type="submit">Войти</button>
                
                <p class="register-link">Нет аккаунта? <a href="#">Регистрация</a></p>
            </form>
        </div>
    </main>

    <!-- Подвал -->
    <footer>
        <div class="footer-content">
            <span></span>
            <span></span>
        </div>
    </footer>
</body>
</html>
