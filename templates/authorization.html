<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    {% include 'header.html' %}

    <!-- Основное содержимое -->
    <main>
        <div class="login-container">
            <h2>Авторизация</h2>

            {% if errors %}
                <div class="error-container">
                    {% for error in errors %}
                        <div class="error-message">{{ error }}</div>
                    {% endfor %}
                </div>
            {% endif %}
            <form action="{{ url_for('user.authorization') }}" method="post">
                <label for="username">Учетная запись</label>
                <input type="text" id="login" name="login" placeholder="qwerty435">

                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="password123">

                <button type="submit">Войти</button>

                <p class="register-link">Нет аккаунта? <a href="{{ url_for('user.registration') }}">Регистрация</a></p>
            </form>
        </div>
    </main>

    <!-- Подвал -->
    <footer>
        <div class="footer-content">
            <span></span>
            <span></span>
        </div>
    </footer>
</body>
</html>
