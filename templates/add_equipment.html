{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Добавление оборудования</h2>
    
    {% if errors %}
    <div class="alert alert-danger">
        <ul>
            {% for error in errors %}
            <li>{{ error }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}
    
    <form method="POST" action="{{ url_for('equipment.add') }}">
        <input type="hidden" name="hall_id" value="{{ hall_id }}">
        
        <div class="mb-3">
            <label class="form-label">Название оборудования:</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Количество:</label>
            <input type="number" name="count" class="form-control" required min="1">
        </div>
        
        <div class="mb-3">
            <label class="form-label">Описание:</label>
            <textarea name="description" class="form-control"></textarea>
        </div>
        
        <button type="submit" class="btn btn-primary">Добавить</button>
        <a href="{{ url_for('equipment.view_equipment', hall_id=hall_id) }}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
