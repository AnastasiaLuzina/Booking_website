<!DOCTYPE html>
<html>
<head>
    <title>Добавить оборудование</title>
</head>
<body>
    <h1>Добавление оборудования</h1>
    
    {% if errors %}
        <div>
            <ul>
                {% for error in errors %}
                <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}
    
    <form method="POST" action="{{ url_for('equipment.add') }}">
        <input type="hidden" name="hall_id" value="{{ hall_id }}">
        
        <label>Название оборудования:</label>
        <input type="text" name="name" required>
        <br>
        
        <label>Количество:</label>
        <input type="number" name="count" required min="1">
        <br>
        
        <label>Описание:</label>
        <textarea name="description"></textarea>
        <br>
        
        <button type="submit">Добавить</button>
    </form>
    
    <a href="{{ url_for('equipment.view_equipment', hall_id=hall_id) }}">Отмена</a>
</body>
</html>
