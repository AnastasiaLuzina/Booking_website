{% extends "base.html" %}

{% block content %}
<h2>Информация о зале</h2>

{% if hall %}
    <div>
        <p><strong>ID:</strong> {{ hall[0] }}</p>
        <p><strong>Название:</strong> {{ hall[1] }}</p>
        <p><strong>Адрес:</strong> {{ hall[2] }}</p>
        <p><strong>Описание:</strong> {{ hall[3] }}</p>
        <p><strong>Лайки:</strong> {{ hall[4] }}</p>
    </div>
{% else %}
    <p>Зал не найден</p>
{% endif %}

<a href="{{ url_for('main.admin_page') }}">
    <button>Назад к списку</button>
</a>
{% endblock %}
