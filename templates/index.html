<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Шапка -->
    <header>
        <div class="logo">LET'S DANCE</div>
        <nav>
            <ul>
                <li><a href="#">Главная</a></li>
                <li><a href="#">Каталог</a></li>
                <li><a href="#">О сервисе</a></li>
            </ul>
        </nav>
    </header>

    <!-- Основное содержимое -->
    <main>
        <div class="login-container">
            <h2>Авторизация</h2>
            <form action="#" method="post">
                <label for="username">Учетная запись</label>
                <input type="text" id="username" name="username" placeholder="qwerty435">

                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="password123">

                <p class="error-message">Неправильная учетная запись или пароль</p>

                <button type="submit">Войти</button>

                <p class="register-link">Нет аккаунта? <a href="#">Регистрация</a></p>
            </form>
        </div>
    </main>

    <!-- Подвал -->
    <footer>
        <div class="footer-content">
            <span></span>
            <span></span>
        </div>
    </footer>
</body>
</html>
