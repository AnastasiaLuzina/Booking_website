<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование профиля</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/profile_edit.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    {% include 'header.html' %}

    <main>
        <div class="container">
            <div class="profile-edit-card">
                <h2><i class="fas fa-user-edit"></i> Редактирование профиля</h2>
                
                <form method="POST" action="{{ url_for('user.edit_user') }}" class="edit-form">
                    <div class="form-columns">
                        <!-- Левая колонка -->
                        <div class="form-column">
                            <div class="form-group">
                                <label for="lastName"><i class="fas fa-user-tag"></i> Фамилия</label>
                                <input type="text" 
                                       name="second_name" 
                                       id="second_name"
                                       value="{{ user.second_name  }}"
                                       placeholder="Введите фамилию">
                            </div>
                            
                            <div class="form-group">
                                <label for="firstName"><i class="fas fa-user"></i> Имя</label>
                                <input type="text" 
                                       name="first_name" 
                                       id="first_name"
                                       value="{{ user.first_name }}"
                                       placeholder="Введите имя">
                            </div>
                            
                            <div class="form-group">
                                <label for="email"><i class="fas fa-envelope"></i> Почта</label>
                                <input type="email" 
                                       name="email" 
                                       id="email"
                                       value="{{ user.email  }}"
                                       placeholder="example@mail.ru">
                            </div>
                        </div>
                        
                        <!-- Правая колонка -->
                        <div class="form-column">
                            <div class="form-group">
                                <label for="patronymic"><i class="fas fa-user-friends"></i> Отчество</label>
                                <input type="text" 
                                       name="patronymic" 
                                       id="patronymic"
                                       value="{{ user.patronymic }}"
                                       placeholder="Введите отчество">
                            </div>
                            
                            <div class="form-group">
                                <label for="age"><i class="fas fa-birthday-cake"></i> Возраст</label>
                                <input type="number" 
                                       name="age" 
                                       id="age"
                                       value="{{ user.age  }}"
                                       placeholder="Введите возраст">
                            </div>
                        </div>
                    </div>
                    
                    {% if errors %}
                        <div class="error-message">
                            {% for error in errors %}
                                <p><i class="fas fa-exclamation-circle"></i> {{ error }}</p>
                            {% endfor %}
                        </div>
                    {% endif %}
                    
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="changePasswordBtn">
                            <i class="fas fa-key"></i> Изменить пароль
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Сохранить изменения
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    {% include 'footer.html' %}

<!-- Модальное окно смены пароля -->
<div id="passwordModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2><i class="fas fa-key"></i> Смена пароля</h2>
        
        <form id="changePasswordForm" class="password-form" method="POST" action="{{ url_for('user.edit_password') }}">
            
            
            <div class="form-group">
                <label for="newPassword"><i class="fas fa-lock"></i> Новый пароль</label>
                <input type="password" name="password" required>
                
            </div>
            {% if errors %}
                <div class="error-message">
                    {% for error in errors %}
                        <p><i class="fas fa-exclamation-circle"></i> {{ error }}</p>
                    {% endfor %}
                </div>
            {% endif %}
            {% if js_alert %}
                <script>
                    alert("{{ js_alert }}");
                </script>
            {% endif %}
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Сохранить пароль
                </button>
            </div>
        </form>
    </div>
</div>
