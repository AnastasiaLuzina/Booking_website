<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Dance</title>
    <link rel="stylesheet" href="space.css">
</head>
<body>
    <!-- Шапка -->
    <header>
        <div class="logo">LET'S DANCE</div>
        <nav>
            <ul class="nav-links">
                <li><a href="#">Главная</a></li>
                <li><a href="#">Каталог</a></li>
                <li><a href="#">О сервисе</a></li>
                <li><a href="#">Личный кабинет</a></li>
            </ul>
        </nav>
    </header>

    <!-- Основное содержимое -->
    <main>
        <div class="container">
            <section class="space-card">
                <div class="card-layout">
                    <!-- Левая часть: серый квадрат -->
                    <div class="favorite-item"></div>

                    <!-- Правая часть: текстовые элементы -->
                    <div class="text-content">
                        <h2>Пространство</h2>
                        <p>Описание пространства</p>
                        <div class="features">
                            <span>Характеристики</span>
                            <i class="arrow-down">&#9660;</i>
                        </div>
                    </div>
                </div>

                <!-- Блок с лайками -->
                <div class="likes">
                    <span>Лайки</span>
                    <i class="heart">&#9825;</i>
                </div>

                <!-- Кнопка бронирования -->
                <button class="book-button">Забронировать</button>
            </section>
        </div>
    </main>

    <!-- Подвал -->
    <footer>
        <div class="container">
            <hr>
            <p>Контакты</p>
        </div>
    </footer>
</body>
</html>
